<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 320 355" width="320" height="355" role="img"
     aria-labelledby="mascot-title mascot-desc">
  <title id="mascot-title">Shelf Scanner shopkeeper cat</title>
  <desc id="mascot-desc">A smiling cream-colored calico cat wearing a vintage navy shopkeeper cap, collared shirt, rust-colored neckerchief and teal apron. He waves a paw in welcome.</desc>
  <defs>
    <linearGradient id="fur" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#FFF5D8"/><stop offset="1" stop-color="#F7D59D"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#FFF9EB"/><stop offset="1" stop-color="#DFC9A7"/>
    </linearGradient>
    <linearGradient id="vest" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#45697A"/><stop offset="1" stop-color="#273E53"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#425363"/><stop offset="1" stop-color="#273341"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="2" flood-color="#1C1B25" flood-opacity=".24"/>
    </filter>
  </defs>

  <!-- Every part is separate so a web developer can animate it independently. -->
  <g id="shopkeeper" stroke-linejoin="round" stroke-linecap="round">

    <!-- Tail behind the uniform -->
    <g id="tail" fill="none" stroke-linecap="round">
      <path d="M232 274 C279 263 302 294 283 317 C272 331 258 320 258 314" stroke="#372B30" stroke-width="26"/>
      <path d="M232 274 C279 263 302 294 283 317 C272 331 258 320 258 314" stroke="#E8B980" stroke-width="18"/>
      <path d="M273 285 C282 293 286 301 282 306" stroke="#C67F5E" stroke-width="9"/>
    </g>

    <!-- Raised greeting arm / paw -->
    <g id="wave-paw" filter="url(#shadow)">
      <path d="M232 263 C254 246 266 228 265 206 C258 198 251 199 246 207 L234 224" fill="#F6DFB6" stroke="#392D31" stroke-width="7"/>
      <path d="M258 207 C250 195 250 181 259 180 C265 180 270 189 273 194 C267 180 267 165 276 163 C285 162 288 184 287 191 C285 178 288 169 295 170 C305 173 298 194 297 199 C307 187 315 192 312 202 C309 216 298 232 278 235 C264 238 256 226 258 207 Z" fill="url(#fur)" stroke="#392D31" stroke-width="7"/>
      <path d="M267 206 C273 210 280 212 286 211" fill="none" stroke="#D5A676" stroke-width="4"/>
      <ellipse cx="281" cy="221" rx="10" ry="6" fill="#DDA48A" opacity=".58"/>
      <path d="M264 242 L253 254" stroke="#D8A47E" stroke-width="4"/>
    </g>

    <!-- Shirt, rolled sleeves, apron straps -->
    <g id="body" filter="url(#shadow)">
      <path d="M95 248 C113 234 128 233 141 230 L181 230 C199 231 215 236 228 250 L242 343 L70 343 L80 270 Z" fill="url(#shirt)" stroke="#392D31" stroke-width="8"/>
      <path d="M81 268 C68 283 67 304 72 322" fill="none" stroke="#D7B98F" stroke-width="9"/>
      <path d="M224 269 C235 287 237 313 232 331" fill="none" stroke="#D7B98F" stroke-width="8"/>

      <!-- Vest with two lapels -->
      <path d="M107 243 L147 258 L149 342 L83 342 L88 278 Z" fill="url(#vest)" stroke="#392D31" stroke-width="6"/>
      <path d="M213 243 L172 258 L169 342 L236 342 L230 278 Z" fill="url(#vest)" stroke="#392D31" stroke-width="6"/>
      <path d="M109 248 L143 266 L121 280 L105 260 Z" fill="#65808A" stroke="#392D31" stroke-width="4"/>
      <path d="M212 248 L176 266 L197 280 L217 260 Z" fill="#65808A" stroke="#392D31" stroke-width="4"/>

      <!-- Shirt collar and neckerchief -->
      <path d="M131 232 L158 248 L143 263 L119 242 Z" fill="#FFF7E5" stroke="#392D31" stroke-width="4"/>
      <path d="M188 232 L160 248 L177 263 L201 242 Z" fill="#FFF7E5" stroke="#392D31" stroke-width="4"/>
      <path d="M148 251 L161 264 L176 250 L169 283 L159 289 L151 278 Z" fill="#BF5C45" stroke="#392D31" stroke-width="4"/>
      <path d="M150 247 Q160 240 170 247 Q166 260 161 263 Q155 262 150 247 Z" fill="#E99E62" stroke="#392D31" stroke-width="3"/>

      <!-- Work apron, prominent enough to read at small size -->
      <path d="M111 278 Q160 269 209 278 L217 343 L101 343 Z" fill="#56847E" stroke="#392D31" stroke-width="6"/>
      <path d="M115 279 L124 242 M205 279 L194 242" stroke="#D6B47A" stroke-width="9" fill="none"/>
      <path d="M115 279 L124 242 M205 279 L194 242" stroke="#392D31" stroke-width="2.4" fill="none"/>
      <path d="M123 321 Q160 333 198 321 L196 343 L124 343 Z" fill="#3E6B68" stroke="#2E4E51" stroke-width="3"/>
      <path d="M136 315 H184" stroke="#B1D0B4" stroke-width="3" opacity=".85"/>
      <path d="M129 292 L136 286" stroke="#D6AD71" stroke-width="3"/>
      <path d="M191 292 L184 286" stroke="#D6AD71" stroke-width="3"/>

      <!-- Tiny badge with a book icon; no raster text -->
      <g id="shop-badge" transform="translate(169 291) rotate(-5)">
        <rect x="0" y="0" width="34" height="23" rx="4" fill="#F8D58F" stroke="#392D31" stroke-width="3"/>
        <path d="M8 7 Q13 5 17 8 V17 Q13 14 8 16 Z M17 8 Q21 5 26 7 V16 Q21 14 17 17 Z" fill="none" stroke="#7D533A" stroke-width="2"/>
      </g>
    </g>

    <!-- Ears sit behind the round face -->
    <g id="ears" stroke="#392D31" stroke-width="8">
      <path d="M66 111 L65 40 Q65 32 73 35 L120 69 L127 118 Z" fill="url(#fur)"/>
      <path d="M254 111 L254 40 Q253 32 245 36 L202 71 L195 118 Z" fill="url(#fur)"/>
      <path d="M78 91 L78 58 L105 81 Z" fill="#CE8C73" stroke="none"/>
      <path d="M241 91 L242 59 L214 80 Z" fill="#CE8C73" stroke="none"/>
    </g>

    <!-- Large face remains familiar to the original mascot -->
    <g id="head" filter="url(#shadow)">
      <path d="M160 73 C219 70 259 110 259 159 C259 187 244 201 237 207 C240 218 229 227 217 226 C204 239 181 243 160 242 C139 243 118 239 104 226 C91 227 80 218 83 206 C73 199 62 184 62 157 C62 107 102 75 160 73 Z"
         fill="url(#fur)" stroke="#392D31" stroke-width="8"/>
      <!-- Original calico brow marks -->
      <path d="M102 89 L128 75 L147 106 L117 120 Z" fill="#C47454"/>
      <path d="M218 89 L191 75 L174 106 L204 120 Z" fill="#C47454"/>
      <path d="M153 86 L160 78 L167 86 L164 100 L156 100 Z" fill="#FCE8C8" opacity=".7"/>
      <path d="M95 139 C84 155 85 174 94 186" stroke="#FFFFFF" stroke-width="7" fill="none" opacity=".22"/>

      <!-- Friendly crescent eyes -->
      <path d="M111 153 Q126 138 141 153" stroke="#3E3134" stroke-width="7" fill="none"/>
      <path d="M178 153 Q193 138 208 153" stroke="#3E3134" stroke-width="7" fill="none"/>
      <ellipse cx="104" cy="174" rx="16" ry="8" fill="#E9988B" opacity=".34"/>
      <ellipse cx="216" cy="174" rx="16" ry="8" fill="#E9988B" opacity=".34"/>
      <!-- Nose / mouth / little smiling tongue -->
      <path d="M151 173 Q160 170 169 173 Q161 181 160 182 Q159 182 151 173 Z" fill="#D58A80"/>
      <path d="M160 182 L160 189 M160 189 Q146 202 135 188 M160 189 Q174 202 185 188" stroke="#443437" stroke-width="5" fill="none"/>
      <path d="M150 197 Q160 204 170 197" fill="none" stroke="#C67D76" stroke-width="2.4" opacity=".7"/>
      <!-- Whisker marks -->
      <path d="M92 185 L49 180 M92 194 L54 204 M228 185 L271 180 M228 194 L266 204" stroke="#68504A" stroke-width="3.5" fill="none"/>
      <circle cx="101" cy="184" r="2.8" fill="#BA8F75"/>
      <circle cx="219" cy="184" r="2.8" fill="#BA8F75"/>
    </g>

    <!-- Vintage little proprietor's cap, carefully leaves ears visible -->
    <g id="shop-cap" filter="url(#shadow)">
      <path d="M111 95 C109 62 126 44 160 42 C194 42 211 64 211 95 Z" fill="url(#cap)" stroke="#392D31" stroke-width="7"/>
      <path d="M126 61 C138 53 156 51 174 55" fill="none" stroke="#77909B" stroke-width="5" opacity=".7"/>
      <path d="M109 91 C131 84 188 84 211 91 L215 107 Q160 117 105 107 Z" fill="#30485B" stroke="#392D31" stroke-width="6"/>
      <path d="M111 95 Q160 87 209 95" fill="none" stroke="#D3A269" stroke-width="4"/>
      <path d="M118 110 Q160 117 201 110" stroke="#162838" stroke-width="3" fill="none" opacity=".7"/>
      <g id="cap-emblem">
        <rect x="145" y="65" width="30" height="24" rx="5" fill="#E9BC76" stroke="#392D31" stroke-width="3"/>
        <path d="M151 73 Q155 71 160 74 V82 Q155 80 151 82 Z M160 74 Q165 71 169 73 V82 Q165 80 160 82 Z" fill="none" stroke="#4B4B45" stroke-width="1.9"/>
      </g>
    </g>

    <!-- Resting left paw laid over apron edge -->
    <g id="rest-paw" filter="url(#shadow)">
      <path d="M76 300 Q79 287 92 285 Q105 282 114 294 Q119 302 117 315 Q114 327 101 328 L80 327 Q67 321 76 300 Z" fill="url(#fur)" stroke="#392D31" stroke-width="6"/>
      <path d="M89 291 L88 303 M101 292 L104 303" stroke="#D4A777" stroke-width="3"/>
    </g>
  </g>
</svg>
